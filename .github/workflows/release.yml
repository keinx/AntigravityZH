name: Build & Release

on:
  push:
    branches:
      - "main"
      - "feat/*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 1.0.0，留空默认 1.0.0）"
        required: false
        default: "1.0.0"
      publish_release:
        description: "打包完成后自动发布到 GitHub Release"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    name: Test & Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go vet & unit tests (Windows)
        shell: bash
        run: |
          go vet ./...
          go test -v ./...

      - name: Build Windows executable
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -ldflags="-s -w -H windowsgui" \
            -o dist/AntigravityZH-windows-amd64.exe ./cmd/antigravity-zh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist/AntigravityZH-windows-amd64.exe
          if-no-files-found: error

  build-macos:
    name: Test & Build macOS Artifacts (arm64 & amd64)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run JS syntax check & unit tests
        run: |
          node -c assets/aglaunch_hook.js
          node -c assets/renderer_i18n.js
          node -c assets/renderer_skin.js
          node -c assets/renderer_theme.js
          node -c assets/renderer_settings.js
          node assets/renderer_i18n_test.js
          node assets/renderer_skin_test.js
          node assets/renderer_theme_test.js
          node assets/renderer_settings_test.js

      - name: Run Go vet (all target platforms) & unit tests (macOS)
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          go test -v ./...

      - name: Resolve version
        id: meta
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' assets/dict_zh_cn.json | head -n 1)"
            VER="${VER:-1.0.0}"
          fi
          VER="${VER#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Package macOS arm64 & amd64 (.dmg)
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh arm64 "${{ steps.meta.outputs.version }}"
          ./scripts/package-macos.sh amd64 "${{ steps.meta.outputs.version }}"

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-arm64
          path: dist/AntigravityZH-darwin-arm64.dmg
          if-no-files-found: error

      - name: Upload macOS amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-amd64
          path: dist/AntigravityZH-darwin-amd64.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum AntigravityZH-windows-amd64.exe AntigravityZH-darwin-arm64.dmg AntigravityZH-darwin-amd64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-macos.outputs.version }}
          name: v${{ needs.build-macos.outputs.version }}
          generate_release_notes: true
          body: |
            ### 下载说明（共 3 个平台安装包）
            - **Windows (64 位)**：`AntigravityZH-windows-amd64.exe`（双击直接运行）
            - **macOS (Apple Silicon / M1-M4)**：`AntigravityZH-darwin-arm64.dmg`（打开后拖进「应用程序」）
            - **macOS (Intel 芯片)**：`AntigravityZH-darwin-amd64.dmg`（打开后拖进「应用程序」）

            ### macOS 首次打开提示说明
            如首次打开提示「无法验证开发者 / 已损坏」，打开终端运行一次以下命令即可：
            ```bash
            xattr -cr /Applications/AntigravityZH.app
            ```

            启动后打开 Antigravity **设置 → 浏览器下方 → 启动器设置** 即可配置汉化、预设主题、自定义皮肤与启动动画。
          files: |
            dist/AntigravityZH-darwin-amd64.dmg
            dist/AntigravityZH-darwin-arm64.dmg
            dist/AntigravityZH-windows-amd64.exe
            dist/SHA256SUMS.txt
